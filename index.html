<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>My Live Player</title>

  <script src="https://cdn.jsdelivr.net/npm/shaka-player@4.16.2/dist/shaka-player.compiled.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #080b12;
      color: white;
      font-family: Arial, sans-serif;
    }

    .container {
      width: 94%;
      max-width: 1100px;
      margin: 40px auto;
    }

    h1 {
      margin-bottom: 20px;
    }

    .input-area {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    input {
      flex: 1;
      padding: 14px;
      border-radius: 8px;
      border: 1px solid #333;
      background: #151a24;
      color: white;
      outline: none;
    }

    button {
      padding: 14px 24px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background: #1d4ed8;
    }

    .player {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: black;
      border-radius: 12px;
      overflow: hidden;
    }

    video {
      width: 100%;
      height: 100%;
      display: block;
    }

    #status {
      margin-top: 12px;
      color: #aaa;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>My Live Player</h1>

  <div class="input-area">

    <input
      id="mpdUrl"
      type="text"
      placeholder="Paste .mpd URL here"
    >

    <button onclick="loadStream()">
      Load
    </button>

  </div>

  <div class="player">
    <video
      id="video"
      controls
      autoplay
      playsinline>
    </video>
  </div>

  <div id="status">
    Enter an MPD URL and click Load.
  </div>

</div>


<script>

let player;

async function initPlayer() {

  shaka.polyfill.installAll();

  if (!shaka.Player.isBrowserSupported()) {

    document.getElementById("status").textContent =
      "Your browser does not support this player.";

    return;
  }

  const video = document.getElementById("video");

  player = new shaka.Player();

  await player.attach(video);

  player.addEventListener("error", function(event) {

    console.error("Shaka Error:", event.detail);

    document.getElementById("status").textContent =
      "Stream error. Check the MPD URL and CORS permissions.";

  });
}


async function loadStream() {

  const input = document.getElementById("mpdUrl");

  const url = input.value.trim();

  if (!url) {

    alert("Paste an MPD URL first.");

    return;
  }

  document.getElementById("status").textContent =
    "Loading live stream...";

  try {

    await player.load(url);

    document.getElementById("status").textContent =
      "Live stream loaded.";

    document.getElementById("video").play().catch(() => {});

  } catch (error) {

    console.error(error);

    document.getElementById("status").textContent =
      "Could not load stream. Check the MPD URL, CORS, authentication, or expiration.";

  }
}


initPlayer().catch(console.error);

</script>

</body>
</html>
