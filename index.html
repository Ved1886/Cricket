<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live Cricket</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .player-container {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background: #000;
    }

    .loading-spinner {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #000;
      color: #fff;
      gap: 12px;
      font-size: 14px;
      letter-spacing: 0.5px;
      z-index: 10;
      transition: opacity 0.3s ease;
    }

    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(255, 255, 255, 0.15);
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>
<body>

  <div class="player-container">
    <div class="loading-spinner" id="loading">
      <div class="spinner"></div>
      <span>Loading live stream...</span>
    </div>

    <iframe
      id="livePlayer"
      src="https://allrounder3-0.pages.dev/cricket/sony-3"
      allow="autoplay; encrypted-media; fullscreen; picture-in-picture"
      allowfullscreen
      scrolling="no">
    </iframe>
  </div>

  <script>
    const iframe = document.getElementById("livePlayer");
    const loading = document.getElementById("loading");

    // Dynamic stream resolver from query param (?id=hindi etc.)
    const params = new URLSearchParams(window.location.search);
    const streamId = params.get("id") || "hindi";

    fetch("https://allrounderid2.pages.dev/id.json")
      .then(res => res.json())
      .then(data => {
        if (data && Array.isArray(data.iframes)) {
          const match = data.iframes.find(item => item.id === streamId);
          if (match && match.iframeSrc && match.iframeSrc !== iframe.src) {
            iframe.src = match.iframeSrc;
          }
        }
      })
      .catch(err => {
        console.warn("Using default stream", err);
      });

    iframe.addEventListener("load", () => {
      setTimeout(() => {
        loading.style.opacity = "0";
        setTimeout(() => {
          loading.style.display = "none";
        }, 300);
      }, 500);
    });
  </script>

</body>
</html>
